    <!--
      Tải font không chặn render. Trước đây thẻ này là <link rel="stylesheet">
      thường và một mình nó đẩy FCP/LCP lên 5,7 giây: trình duyệt không vẽ gì
      cho tới khi Google Fonts trả lời. media="print" khiến nó tải ở mức ưu
      tiên thấp, onload mới nâng lên "all". Có display=swap nên chữ hiện ngay
      bằng font hệ thống rồi tự đổi.

      Dải trục đã thu hẹp về đúng phần thực dùng. Bỏ SOFT/WONK vì chưa bao giờ
      xin trong URL — font trả về không có hai trục đó nên CSS đặt chúng chỉ là
      lệnh rỗng.
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Newsreader:opsz,wght@6..72,400..600&family=Archivo:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <noscript>

    <script>
      // Chạy trước khi vẽ khung hình đầu tiên. Hai việc:
      //  1. Đặt data-theme sớm để phần đầu trang tĩnh bên dưới lấy đúng bộ màu —
      //     nếu để React đặt thì người dùng theme tối sẽ thấy một nháy trắng.
      //  2. Không tin giá trị trong localStorage: chỉ nhận đúng bốn id đã biết.
      (function () {
        try {
          var t = new URLSearchParams(location.search).get('theme') || localStorage.getItem('theme');
          if (['editorial', 'arcade', 'bento', 'terminal'].indexOf(t) === -1) t = 'editorial';
          document.documentElement.dataset.theme = t;
          var dark = t === 'arcade' || t === 'terminal';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#08070c' : '#f7f4ed');
        } catch (e) {
          document.documentElement.dataset.theme = 'editorial';
        }
      })();
    </script>
