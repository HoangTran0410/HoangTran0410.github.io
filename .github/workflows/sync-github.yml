name: Sync GitHub stats

on:
  schedule:
    # 00:00 UTC hằng ngày = 07:00 giờ Việt Nam
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit nếu số liệu có thay đổi
        run: |
          if git diff --quiet; then
            echo "Không có gì đổi."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: sync số liệu GitHub"
          git push
